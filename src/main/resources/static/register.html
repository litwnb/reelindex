<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<form id="registerForm" class="bg-white p-6 rounded shadow-md w-80">
    <h1 class="text-2xl font-bold mb-6 text-center">Register</h1>

    <label for="username" class="block mb-1">Username</label>
    <input
        id="username"
        name="username"
        type="text"
        required
        autocomplete="username"
        class="w-full p-2 mb-4 border rounded"
    />

    <label for="password" class="block mb-1">Password</label>
    <input
        id="password"
        name="password"
        type="password"
        required
        autocomplete="new-password"
        class="w-full p-2 mb-6 border rounded"
    />

    <button
        type="submit"
        class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700"
    >
        Register
    </button>

    <p id="message" class="text-sm text-center mt-4"></p>

    <p class="text-center text-sm mt-4">
        Already have an account?
        <a href="/login.html" class="text-blue-600 hover:underline">Login</a>
    </p>
</form>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = Object.fromEntries(new FormData(e.target).entries());
        const msg = document.getElementById('message');

        try {
            const res = await fetch('/api/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                msg.textContent = 'Registration successful! Redirecting to login...';
                msg.className = 'text-sm text-center mt-4 text-green-600';

                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);
            } else {
                msg.textContent = 'Registration failed. Please try another username.';
                msg.className = 'text-sm text-center mt-4 text-red-600';
            }
        } catch (error) {
            msg.textContent = 'Unable to connect to the server. Please try again.';
            msg.className = 'text-sm text-center mt-4 text-red-600';
        }
    });
</script>

</body>
</html>
